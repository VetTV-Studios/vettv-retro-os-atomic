---
# QA diag run (Faye 11-24): ONE fresh 64G qcow2 overlay (its own disk, never a
# gate disk) on the verified raw, -nic none. A diagnostic unit arrives ONLY as
# QEMU SMBIOS systemd credentials (systemd.extra-unit + script) and runs on both
# first-power-on boots, dumping to ttyS0. No login, no password. Nothing is baked
# into the image; the raw is not modified and the overlay is never written
# host-side. bootupctl update -vvv (a real write) runs last, with the ESP file
# tree hashed before and after. Uploads only logs and screenshots.
name: QA VM diag

on:
  workflow_dispatch:
    inputs:
      raw-artifact:
        required: true
        default: "14961772182"
      raw-xz-sha256:
        required: true
        default: "63d916f2677af7cad41633d21bb080c2b3ccc8d3d886033a65911c3bd509a200"
      raw-sha256:
        required: true
        default: "64ee3e71df651d0cc3caf49e746f9b8b77126b285f07dc682521e66f2b3d631b"
      expected-digest:
        description: "image digest rpm-ostree must report as booted"
        required: true
        default: "sha256:11a980d5a11fda7608ff8bd750a7dbb12a0acddc457816cb1893d4a91bd0db0c"

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/qa-out
      WORK: /mnt/qa
    steps:
      - uses: actions/checkout@v4
      - name: Prep runner, KVM, QEMU
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"; mkdir -p "$OUT/shots"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf gdisk btrfs-progs ostree netpbm >/dev/null
          ls -l /dev/kvm; qemu-system-x86_64 --version | head -1
      - name: Fetch raw and verify hashes (stop on mismatch)
        working-directory: ${{ env.WORK }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.raw-artifact }}/zip" > raw.zip
          sha256sum raw.zip | tee "$OUT/hashes.txt"; unzip -q raw.zip && rm raw.zip
          XZ=$(find . -name disk.raw.xz | head -1); got=$(sha256sum "$XZ" | cut -d' ' -f1)
          echo "$got  disk.raw.xz (expected ${{ inputs.raw-xz-sha256 }})" | tee -a "$OUT/hashes.txt"
          [ "$got" = "${{ inputs.raw-xz-sha256 }}" ] || { echo "RAW XZ HASH MISMATCH"; exit 1; }
          xz -dc -T0 "$XZ" | cp --sparse=always /dev/stdin disk.raw; rm -f "$XZ"
          got=$(sha256sum disk.raw | cut -d' ' -f1)
          want="${{ inputs.raw-sha256 }}"; [ "$want" = record ] && want=$got   # "record": xz hash above is the gate
          echo "$want" > "$WORK/raw.expected"
          echo "$got  disk.raw before boot (expected ${{ inputs.raw-sha256 }})" | tee -a "$OUT/hashes.txt"
          [ "$got" = "$want" ] || { echo "RAW HASH MISMATCH"; exit 1; }
          chmod a-w disk.raw
          qemu-img create -q -f qcow2 -b "$WORK/disk.raw" -F raw D.qcow2 64G
          qemu-img info D.qcow2 | tee -a "$OUT/hashes.txt"
      - name: "Diag boot: credential-delivered unit on both first-power-on boots, capture over serial"
        run: |
          python3 .github/scripts/qa_vm_diag.py --unit-only --disk "$WORK/D.qcow2" --out "$OUT" \
            --script .github/scripts/qa_diag_guest.sh
      - name: Host-side read-only inspection of the overlay after shutdown
        if: always()
        run: sudo bash .github/scripts/qa_inspect.sh "$WORK/D.qcow2" "$OUT/D-after-inspect.txt" || true
      - name: Verify raw hash again, drop disks
        if: always()
        run: |
          sudo chown -R "$USER" "$OUT"
          rm -f "$RUNNER_TEMP"/cred-*
          got=$(sha256sum "$WORK/disk.raw" | cut -d' ' -f1)
          want=$(cat "$WORK/raw.expected")
          echo "$got  disk.raw after run (expected $want)" | tee -a "$OUT/hashes.txt"
          rm -f "$WORK/D.qcow2" "$WORK/disk.raw"
          find "$OUT" -type f | sort; du -sh "$OUT"
          [ "$got" = "$want" ] || { echo "RAW CHANGED"; exit 1; }
      - name: Diag checks (aleph version, bootloader-update x2, bootupctl, failed units, digest)
        if: always()
        working-directory: ${{ env.OUT }}/diag
        run: |
          set +e; R=CHECKS.txt; : > $R; fail=0
          chk(){ if eval "$2"; then echo "PASS  $1" | tee -a $R; else echo "FAIL  $1" | tee -a $R; fail=1; fi; }
          chk "aleph version non-null (boot 1)" "grep -Eq '\"version\": *\"[^\"]+\"' b1-03-aleph.txt"
          chk "aleph version non-null (boot 2)" "grep -Eq '\"version\": *\"[^\"]+\"' 00-aleph.txt"
          chk "bootloader-update OK on boot 1" "grep -q 'exit 0' b1-02-journal-bootloader-update.txt && grep -q 'Finished bootloader-update' b1-02-journal-bootloader-update.txt && ! grep -q 'Failed to start bootloader-update' b1-02-journal-bootloader-update.txt"
          chk "bootloader-update OK on boot 2" "grep -q 'Finished bootloader-update' 02-journal-bootloader-update-b0.txt && ! grep -q 'Failed to start bootloader-update' 02-journal-bootloader-update-b0.txt"
          chk "bootupctl status clean (exit 0)" "head -1 04-bootupctl-status.txt | grep -q '(exit 0)'"
          chk "failed units only nvidia-cdi-refresh" "! grep -E '^\S* *[^ ]+\.(service|path|socket|mount|timer|target) +loaded failed' 07-systemctl-failed.txt | grep -v nvidia-cdi-refresh | grep -q ."
          chk "booted digest = ${{ inputs.expected-digest }}" "grep -A3 '●' 06-rpm-ostree-status-v.txt | grep -q 'Digest: ${{ inputs.expected-digest }}'"
          chk "bootupctl update -vvv ran last; ESP before/after hashed" "test -s 18a-esp-tree-before-update.txt && test -s 18c-esp-tree-after-update.txt"
          cat $R; exit $fail
      - name: Upload QA evidence (logs and screenshots only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-vm-diag-${{ github.run_id }}
          path: qa-out/
          retention-days: 14
