---
# QA VM gate: boots the exact raw disk from a build-disk run under QEMU/KVM,
# offline, on a 64G disk, twice. Captures serial log + screenshots, then
# inspects the guest disk from the host (journal, failed units, root growth).
# Uploads only logs, screenshots and hash lines. No game files, ever.
name: QA VM gate

on:
  workflow_dispatch:
    inputs:
      source-run:
        description: "build-disk run id"
        required: true
        default: "45474882455"
      raw-artifact:
        description: "raw artifact id"
        required: true
        default: "14961772182"
      raw-sha256:
        description: "expected sha256 of image/disk.raw.xz"
        required: true
        default: "63d916f2677af7cad41633d21bb080c2b3ccc8d3d886033a65911c3bd509a200"
      qcow2-artifact:
        description: "qcow2 artifact id (hashed only, not booted)"
        required: true
        default: "14959218696"
      qcow2-artifact-digest:
        description: "expected GitHub artifact digest of the qcow2 zip"
        required: true
        default: "b2b4d8dfe52368de5ee1f1dedb9e9cda9e12ffdb10142491d5fd71950c323ee5"
      expected-image:
        description: "image the raw was built from (recorded in hashes.txt)"
        required: true
        default: "ghcr.io/vettv-studios/vettv-retro-os@sha256:11a980d5a11fda7608ff8bd750a7dbb12a0acddc457816cb1893d4a91bd0db0c (run 45472109345)"

permissions:
  contents: read
  actions: read

jobs:
  vm-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/qa-out
      WORK: /mnt/qa
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          mkdir -p "$OUT/shots"
          df -h / /mnt | tee "$OUT/df-before.txt"

      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf gdisk btrfs-progs ostree netpbm python3 >/dev/null
          ls -l /dev/kvm
          qemu-system-x86_64 --version | head -1 | tee "$OUT/qemu-version.txt"

      - name: Fetch raw artifact and verify hash (stop on mismatch)
        working-directory: ${{ env.WORK }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.raw-artifact }}" \
            --jq '[.id,.name,.digest,.workflow_run.id]|@tsv' | tee "$OUT/raw-artifact-meta.txt"
          grep -q "${{ inputs.source-run }}" "$OUT/raw-artifact-meta.txt" || { echo "artifact not from source run"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.raw-artifact }}/zip" > raw.zip
          sha256sum raw.zip | tee "$OUT/hashes.txt"
          unzip -q raw.zip && rm raw.zip
          XZ=$(find . -name disk.raw.xz | head -1)
          got=$(sha256sum "$XZ" | cut -d' ' -f1)
          echo "$got  disk.raw.xz (expected ${{ inputs.raw-sha256 }})" | tee -a "$OUT/hashes.txt"
          [ "$got" = "${{ inputs.raw-sha256 }}" ] || { echo "RAW HASH MISMATCH"; exit 1; }
          find . -name 'SHA256SUMS*' -exec cat {} \; | tee -a "$OUT/hashes.txt"
          xz -dc -T0 "$XZ" | cp --sparse=always /dev/stdin disk.raw
          rm -f "$XZ"
          sha256sum disk.raw | tee -a "$OUT/hashes.txt"
          echo "expected image: ${{ inputs.expected-image }}" | tee -a "$OUT/hashes.txt"
          qemu-img create -f qcow2 -b "$WORK/disk.raw" -F raw gate.qcow2 64G
          df -h /mnt | tee -a "$OUT/df-before.txt"

      - name: Boot 1 (offline, OVMF, 64G)
        run: python3 .github/scripts/qa_vm_boot.py --disk "$WORK/gate.qcow2" --out "$OUT" --tag boot1 --wait 420

      - name: Inspect guest disk after boot 1
        run: sudo bash .github/scripts/qa_inspect.sh "$WORK/gate.qcow2" "$OUT/boot1-inspect.txt"

      - name: Boot 2 (growth must be unchanged)
        run: python3 .github/scripts/qa_vm_boot.py --disk "$WORK/gate.qcow2" --out "$OUT" --tag boot2 --wait 300

      - name: Inspect guest disk after boot 2
        run: sudo bash .github/scripts/qa_inspect.sh "$WORK/gate.qcow2" "$OUT/boot2-inspect.txt"

      - name: Power-cut test (fresh 64G disk, kill QEMU mid first boot, then boot again)
        run: |
          rm -f /tmp/ovmf-vars.fd
          qemu-img create -f qcow2 -b "$WORK/disk.raw" -F raw "$WORK/cut.qcow2" 64G
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/cut.qcow2" --out "$OUT" --tag cut1 --wait 25 --kill
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/cut.qcow2" --out "$OUT" --tag cut2 --wait 420
          sudo bash .github/scripts/qa_inspect.sh "$WORK/cut.qcow2" "$OUT/cut2-inspect.txt"
          rm -f "$WORK/cut.qcow2"

      - name: Hash qcow2 artifact (not booted)
        if: always()
        working-directory: ${{ env.WORK }}
        run: |
          rm -f gate.qcow2 disk.raw
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.qcow2-artifact }}" \
            --jq '[.id,.name,.digest,.workflow_run.id]|@tsv' | tee -a "$OUT/hashes.txt"
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.qcow2-artifact }}/zip" > q.zip
          got=$(sha256sum q.zip | cut -d' ' -f1)
          echo "$got  qcow2 artifact zip (expected ${{ inputs.qcow2-artifact-digest }})" | tee -a "$OUT/hashes.txt"
          unzip -q q.zip && rm q.zip
          find . -name '*.qcow2' -exec sha256sum {} \; | tee -a "$OUT/hashes.txt"
          [ "$got" = "${{ inputs.qcow2-artifact-digest }}" ] || { echo "QCOW2 HASH MISMATCH"; exit 1; }

      - name: Upload QA evidence (logs, screenshots, hashes only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-vm-gate-${{ inputs.source-run }}
          path: qa-out/
          retention-days: 14
