---
# QA follow-up gate (Naomi, 11-24): ESP and /boot hashes before boot 1, after
# boot 1 and after boot 2; and power cut during vettv-grow-root, then reboot.
# Uploads only logs, screenshots and hash lines.
name: QA VM cut gate

on:
  workflow_dispatch:
    inputs:
      raw-artifact:
        required: true
        default: "14961772182"
      raw-sha256:
        required: true
        default: "63d916f2677af7cad41633d21bb080c2b3ccc8d3d886033a65911c3bd509a200"

permissions:
  contents: read
  actions: read

jobs:
  cut-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/qa-out
      WORK: /mnt/qa
    steps:
      - uses: actions/checkout@v4
      - name: Prep runner, KVM, QEMU
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"; mkdir -p "$OUT/shots"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf gdisk btrfs-progs ostree netpbm >/dev/null
          ls -l /dev/kvm
      - name: Fetch raw and verify hash (stop on mismatch)
        working-directory: ${{ env.WORK }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.raw-artifact }}/zip" > raw.zip
          sha256sum raw.zip | tee "$OUT/hashes.txt"; unzip -q raw.zip && rm raw.zip
          XZ=$(find . -name disk.raw.xz | head -1); got=$(sha256sum "$XZ" | cut -d' ' -f1)
          echo "$got  disk.raw.xz (expected ${{ inputs.raw-sha256 }})" | tee -a "$OUT/hashes.txt"
          [ "$got" = "${{ inputs.raw-sha256 }}" ] || { echo "RAW HASH MISMATCH"; exit 1; }
          xz -dc -T0 "$XZ" | cp --sparse=always /dev/stdin disk.raw; rm -f "$XZ"
          for d in A B C; do qemu-img create -q -f qcow2 -b "$WORK/disk.raw" -F raw $d.qcow2 64G; done
      - name: "A: hashes before boot 1, after boot 1, after boot 2"
        run: |
          sudo bash .github/scripts/qa_inspect.sh "$WORK/A.qcow2" "$OUT/A0-before-inspect.txt"
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/A.qcow2" --out "$OUT" --tag A1 --wait 300
          sudo bash .github/scripts/qa_inspect.sh "$WORK/A.qcow2" "$OUT/A1-inspect.txt"
          rm -f /tmp/ovmf-vars.fd
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/A.qcow2" --out "$OUT" --tag A2 --wait 240
          sudo bash .github/scripts/qa_inspect.sh "$WORK/A.qcow2" "$OUT/A2-inspect.txt"
          rm -f "$WORK/A.qcow2" /tmp/ovmf-vars.fd
      - name: "B: cut the moment grow-root starts, then reboot"
        run: |
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/B.qcow2" --out "$OUT" --tag B1 --wait 240 --kill-on 'Starting.*(vettv-grow-root|grow root)' --kill-delay 0
          sudo bash .github/scripts/qa_inspect.sh "$WORK/B.qcow2" "$OUT/B1-afterkill-inspect.txt"
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/B.qcow2" --out "$OUT" --tag B2 --wait 300
          sudo bash .github/scripts/qa_inspect.sh "$WORK/B.qcow2" "$OUT/B2-inspect.txt"
          rm -f "$WORK/B.qcow2" /tmp/ovmf-vars.fd
      - name: "C: cut 0.4 s into grow-root (between partition write and btrfs resize), then reboot"
        run: |
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/C.qcow2" --out "$OUT" --tag C1 --wait 240 --kill-on 'Starting.*(vettv-grow-root|grow root)' --kill-delay 0.4
          sudo bash .github/scripts/qa_inspect.sh "$WORK/C.qcow2" "$OUT/C1-afterkill-inspect.txt"
          python3 .github/scripts/qa_vm_boot.py --disk "$WORK/C.qcow2" --out "$OUT" --tag C2 --wait 300
          sudo bash .github/scripts/qa_inspect.sh "$WORK/C.qcow2" "$OUT/C2-inspect.txt"
          rm -f "$WORK/C.qcow2" "$WORK/disk.raw"
      - name: Upload QA evidence (logs, screenshots, hashes only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-vm-cut-${{ inputs.raw-artifact }}
          path: qa-out/
          retention-days: 14
